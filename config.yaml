snowflake:
  account: "your_account.snowflakecomputing.com"
  user: "your_username"
  password: "your_password"
  warehouse: "your_warehouse"
  database: "your_database"
  schema: "your_schema"
  loadtracker_table: "LOADTRACKER"

sqlserver:
  server: "your_sqlserver_hostname"
  database: "your_database"
  auth_type: "windows"  # Use 'windows' for Windows Authentication or 'sql' for SQL Server Authentication
  # username and password only needed if auth_type is 'sql'
  schema: "dbo"

filesystem:
  data_root: "C:/SnowflakeReplication"
